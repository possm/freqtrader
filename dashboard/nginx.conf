server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # HTML files should not be cached so index.html updates pick up new hashes
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
        try_files $uri =404;
    }

    # Vite outputs hashed assets to /assets which can be cached permanently
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all Freqtrade API calls through to avoid CORS
    location /api/ {
        proxy_pass http://192.168.2.4:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Suppress the WWW-Authenticate: Basic header so the browser
        # never shows its native auth popup — the dashboard handles auth in JS.
        proxy_hide_header WWW-Authenticate;
    }
}
