server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Always serve fresh HTML and JSX — Babel-Standalone files have no hashed names,
    # so without this the browser would hold onto stale code after a redeploy.
    location ~* \.(html|jsx)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all Freqtrade API calls through to avoid CORS
    location /api/ {
        proxy_pass http://192.168.2.4:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Suppress the WWW-Authenticate: Basic header so the browser
        # never shows its native auth popup — the dashboard handles auth in JS.
        proxy_hide_header WWW-Authenticate;
    }
}
