  # ─────────────────────────────────────────────────────────────────────────────
  # 8082 — DRY-RUN: WolfBreakout_PVB academic strategy
  # Strategy: WolfBreakout_PVB (Parkinson Volatility Breakout + BTC filter)
  # Whitelist: 18 Kraken EUR pairs
  # ─────────────────────────────────────────────────────────────────────────────
  freqtrade-academic-dryrun:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    container_name: freqtrade-wolf-academic-dryrun
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "./config_academic_dryrun.json:/freqtrade/config_academic_dryrun.json"
